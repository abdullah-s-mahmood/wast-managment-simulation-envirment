name: Documentation and State Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned development package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Prepare exact project environment
        run: python3 -I scripts/python_environment.py sync --uv uv
      - name: Lint, strict types and complete regression suite in isolated Python
        run: .venv/bin/python -I scripts/python_environment.py check
      - name: Validate sprint documents and progress state
        run: .venv/bin/python -I scripts/validate_project_docs.py
      - name: Validate clean-room inventory boundary
        run: .venv/bin/python -I scripts/validate_repository_boundary.py
      - name: Validate scientific evidence ledger structure
        run: .venv/bin/python -I scripts/validate_evidence_ledger.py
      - name: Validate architectural decisions and risk records
        run: |
          .venv/bin/python -I scripts/validate_change_control.py
          .venv/bin/python -I scripts/validate_risk_protocol.py
      - name: Verify immutable source-audit freeze
        run: .venv/bin/python -I scripts/validate_audit_freeze.py docs/audit/S016_AUDIT_FREEZE.json
      - name: Validate platform target planning and evidence boundaries
        run: .venv/bin/python -I scripts/validate_platform_matrix.py check docs/platforms/S017_MATRIX.json
      - name: Verify independently installed SUMO and matching TraCI API
        run: |
          wm_sumo_parent=$(mktemp -d)
          .venv/bin/python -I scripts/sumo_smoke.py --install --prefix "$wm_sumo_parent/venv" --work-dir "$wm_sumo_parent/installation-evidence"
      - name: Verify fresh ns-3 core build and minimal execution
        run: |
          wm_ns3_cxx=$(command -v g++)
          wm_ns3_cmake=$(command -v cmake)
          wm_ns3_ninja=$(command -v ninja)
          command -v g++ cmake ninja
          wm_ns3_parent=$(mktemp -d)
          curl --fail --location --proto '=https' --max-time 180 --max-filesize 67108864 https://www.nsnam.org/releases/ns-3.47.tar.bz2 --output "$wm_ns3_parent/ns-3.47.tar.bz2"
          .venv/bin/python -I scripts/ns3_smoke.py --archive "$wm_ns3_parent/ns-3.47.tar.bz2" --work-dir "$wm_ns3_parent/build-evidence" --cxx "$wm_ns3_cxx" --cmake "$wm_ns3_cmake" --ninja "$wm_ns3_ninja"

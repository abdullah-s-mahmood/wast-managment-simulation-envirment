name: Documentation and State Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sprint documents and progress state
        run: python scripts/validate_project_docs.py
      - name: Verify charter traceability and negative fixtures
        run: python -m unittest discover -s tests -v
      - name: Validate clean-room inventory boundary
        run: python scripts/validate_repository_boundary.py
      - name: Validate scientific evidence ledger structure
        run: python scripts/validate_evidence_ledger.py
